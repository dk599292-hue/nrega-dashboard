name: Auto Daily NREGA Data Update

on:
  schedule:
    # यह रोज़ सुबह 6:00 बजे (IST) अपने-आप चलेगा
    - cron: '30 0 * * *'
  workflow_dispatch: # मैन्युअल चलाने का ऑप्शन

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        run: python nrega_scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update live_data.json" && git push)